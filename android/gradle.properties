android.useAndroidX=true
android.nonTransitiveRClass=true
# Память задаётся через GRADLE_OPTS: org.gradle.jvmargs заставляет Gradle форкать демон,
# а часть антивирусов блокирует его локальное подключение (Could not connect to the Gradle daemon).
# По той же причине Kotlin компилируем в том же процессе, без отдельного демона.
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
