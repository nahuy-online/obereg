[workspace]
resolver = "2"
members = [
    "crates/obereg-core",
    "crates/obereg-ffi",
    "crates/obereg-jni",
    "crates/obereg-cli",
    "crates/obereg-relay",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Proprietary"
authors = ["Obereg Team"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
